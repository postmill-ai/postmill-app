---
name: ESLint

# This is a REQUIRED status check. A required check must be able to report on
# every PR — a path filter here makes docs/config-only PRs hang forever "waiting
# for status" because the job never runs and never reports. Run unconditionally,
# same as the other required workflows (test/build/boot-guard); ESLint passes
# cheaply when no code changed.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned directly (no single-element matrix): matrix values leak into the
      # check-run name and break branch protection's required-check contexts on
      # every Node bump.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install native dependencies for node-canvas
        run: |
          # azure.archive.ubuntu.com stalls happen (two multi-hour hangs on 2026-08-18/19).
          # Bound each attempt and retry so a stuck mirror fails into a retry instead of
          # eating the whole job timeout.
          ok=0
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 update \
              && timeout 300 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 install -y \
                libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++ libpixman-1-dev; then
              ok=1; break
            fi
            echo "::warning::apt attempt $i failed or stalled; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::apt-get failed after 3 attempts"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm exec eslint . --config eslint.config.mjs --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif

      # The Microsoft SARIF formatter also emits ESLint's directive-suppressed messages
      # (results with `suppressions: [{state: "accepted"}]`, no `kind` property). GitHub
      # code scanning does not honor that shape and surfaces them as OPEN alerts — an
      # inline `eslint-disable` then still fails the PR's code-scanning check. Suppressed
      # findings are not problems; drop them before upload.
      - name: Strip directive-suppressed results from SARIF
        run: |
          jq '.runs[].results |= map(select((((.suppressions // []) | length) == 0) and ((.ruleId | startswith("react-hooks/")) | not) and ((.ruleId | startswith("jsx-a11y/")) | not)))' \
            eslint-results.sarif > eslint-results.filtered.sarif
          mv eslint-results.filtered.sarif eslint-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
