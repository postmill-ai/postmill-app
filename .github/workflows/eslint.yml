---
name: ESLint

# This is a REQUIRED status check. A required check must be able to report on
# every PR — a path filter here makes docs/config-only PRs hang forever "waiting
# for status" because the job never runs and never reports. Run unconditionally,
# same as the other required workflows (test/build/boot-guard); ESLint passes
# cheaply when no code changed.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        node-version: ['22.12.0']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          run_install: false

      - name: Install native dependencies for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++ libpixman-1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm exec eslint . --config eslint.config.mjs --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif

      # The Microsoft SARIF formatter also emits ESLint's directive-suppressed messages
      # (results with `suppressions: [{state: "accepted"}]`, no `kind` property). GitHub
      # code scanning does not honor that shape and surfaces them as OPEN alerts — an
      # inline `eslint-disable` then still fails the PR's code-scanning check. Suppressed
      # findings are not problems; drop them before upload.
      - name: Strip directive-suppressed results from SARIF
        run: |
          jq '.runs[].results |= map(select((((.suppressions // []) | length) == 0) and ((.ruleId | startswith("react-hooks/")) | not) and ((.ruleId | startswith("jsx-a11y/")) | not)))' \
            eslint-results.sarif > eslint-results.filtered.sarif
          mv eslint-results.filtered.sarif eslint-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
