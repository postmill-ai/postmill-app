---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned directly (no single-element matrix): the matrix put the version into
      # the check-run name ("build (24.19.0)"), which breaks branch protection's
      # required-check contexts on every Node bump.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.STORE_PATH }}
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.js', 'apps/**/*.jsx', 'apps/**/*.ts', 'apps/**/*.tsx', 'libraries/**/*.js', 'libraries/**/*.jsx', 'libraries/**/*.ts', 'libraries/**/*.tsx', '!**/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install native dependencies for node-canvas
        run: |
          # azure.archive.ubuntu.com both stalls outright AND degrades to a crawl
          # (multi-minute per-package fetches; observed 2026-08-18/19). Give a
          # degraded-but-alive mirror room to finish — a tight outer timeout just
          # restarts a progressing download — while apt's own 25s connect timeouts
          # catch dead connections. Retry once if the outer bound still trips.
          ok=0
          for i in 1 2; do
            if timeout 300 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=2 update \
              && timeout 900 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=2 install -y \
                libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++ libpixman-1-dev; then
              ok=1; break
            fi
            echo "::warning::apt attempt $i failed or stalled; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::apt-get failed after 2 attempts"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
