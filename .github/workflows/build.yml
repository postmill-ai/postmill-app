---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned directly (no single-element matrix): the matrix put the version into
      # the check-run name ("build (24.19.0)"), which breaks branch protection's
      # required-check contexts on every Node bump.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.STORE_PATH }}
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.js', 'apps/**/*.jsx', 'apps/**/*.ts', 'apps/**/*.tsx', 'libraries/**/*.js', 'libraries/**/*.jsx', 'libraries/**/*.ts', 'libraries/**/*.tsx', '!**/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install native dependencies for node-canvas
        run: |
          # azure.archive.ubuntu.com (the runner default) has been stalling/crawling for
          # days (2026-08-18/19). Try it once with bounded timeouts; on failure rewrite
          # the apt sources to archive.ubuntu.com and try again. apt's 25s socket timeouts
          # catch dead connections; the outer `timeout` bounds a crawling-but-alive mirror.
          ok=0
          for i in 1 2; do
            if [ "$i" = "2" ]; then
              echo "::warning::default mirror failed; switching apt sources to archive.ubuntu.com"
              # GitHub runners route Ubuntu packages through a mirror list
              # (mirror+file:/etc/apt/apt-mirrors.txt) that currently resolves to the
              # stalling azure.archive.ubuntu.com. Rewrite the LIST FILE — that covers
              # every mirror+file: source regardless of format — plus any direct URLs.
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            if timeout 300 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 update \
              && timeout 900 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 install -y \
                libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++ libpixman-1-dev; then
              ok=1; break
            fi
            echo "::warning::apt attempt $i failed or stalled"
          done
          if [ "$ok" != 1 ]; then
            echo "::error::apt-get failed on both mirrors"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # Placeholder origin: the prod build guard (7744869) refuses to build
          # without NEXT_PUBLIC_BACKEND_URL (CSP connect-src). Same value as
          # boot-guard.yml.
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
