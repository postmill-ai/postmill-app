name: Publish Extension

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'pnpm'

      - name: Install native dependencies for node-canvas
        run: |
          # azure.archive.ubuntu.com stalls happen (two multi-hour hangs on 2026-08-18/19).
          # Bound each attempt and retry so a stuck mirror fails into a retry instead of
          # eating the whole job timeout.
          ok=0
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 update \
              && timeout 300 sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 install -y \
                libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev build-essential g++ libpixman-1-dev; then
              ok=1; break
            fi
            echo "::warning::apt attempt $i failed or stalled; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::apt-get failed after 3 attempts"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip extensions
        run: FRONTEND_URL=https://app.postmill.ai pnpm run build:extension

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          file-path: apps/extension/extension.zip