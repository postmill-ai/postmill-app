---
name: "Code Quality Analysis"

# This is a REQUIRED status check (Analyze (javascript-typescript)). A required
# check must report on every PR — a path filter makes docs/config-only PRs hang
# forever "waiting for status" because the job never runs. Run unconditionally,
# same as the other required workflows; CodeQL passes quickly when no code changed.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:


jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - apps/frontend/public/**
              - e2e/**
              - '**/*.spec.ts'
              - '**/*.spec.tsx'
              - '**/*.int-spec.ts'
              - '**/*.int-spec.tsx'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
