name: Fork image
on:
  push:
    branches: [main, fix/openai-gpt6-compat]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fork-image-${{ github.sha }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'AREN-876/postmill-app'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/aren-876/postmill-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restrict publish refs
        run: |
          case "$GITHUB_REF" in refs/heads/main|refs/heads/fix/openai-gpt6-compat) ;; *) exit 1 ;; esac
      - name: Test deployment helpers (no API keys)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/deploy -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an existing SHA tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          tag = os.environ['GITHUB_SHA']
          page = 1
          while True:
              url = f'https://api.github.com/users/aren-876/packages/container/postmill-app/versions?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      versions = json.load(res)
              except urllib.error.HTTPError as err:
                  if err.code == 404 and page == 1:
                      break  # Package has not been created yet.
                  raise SystemExit(f'Cannot check package versions: HTTP {err.code}')
              if any(tag in v.get('metadata', {}).get('container', {}).get('tags', []) for v in versions):
                  raise SystemExit('SHA tag already exists; it will not be overwritten. Use its recorded digest or build a new commit.')
              if len(versions) < 100:
                  break
              page += 1
          PY
      - name: Build amd64 candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: NEXT_PUBLIC_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AREN-876/postmill-app
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,mode=max,scope=fork-image
          provenance: false
      - name: Boot and healthcheck in isolated CI network
        run: bash tools/deploy/smoke-image.sh "$IMAGE"
      - name: Publish verified image (SHA tag only)
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf 'Image: `%s`\n\nPinned reference: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
