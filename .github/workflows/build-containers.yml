---
name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      # App releases only. SDK releases use `sdk-vX.Y.Z` (publish-sdk.yml) and must not
      # trigger an image build.
      - 'v[0-9]*.[0-9]*.[0-9]*'

# NOTE (postmill-ai): repointed to postmill-ai, added packages:write,
# and simplified to a single amd64 build (the target host is amd64-only) that pushes
# both :<tag> and :latest directly. The previous multi-arch matrix + manifest job is
# removed because the org has no arm64 runner and only amd64 is deployed.
jobs:
  build-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # gh release create / upload
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The published image tag IS the release contract; version.txt is the canonical
      # version. Refuse to publish when they disagree (tag pushed without bumping
      # version.txt, or a stale version.txt on the tagged commit).
      - name: Assert the tag matches version.txt
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(tr -d '[:space:]' < version.txt)"; VER="${VER#v}"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match version.txt ('$(tr -d '[:space:]' < version.txt)'). Bump version.txt before tagging, or fix the tag."
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches version.txt."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image (amd64)
        env:
          CONTAINERVER: ${{ github.ref_name }}
          NEXT_PUBLIC_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile \
            -t ghcr.io/postmill-ai/postmill-app:${CONTAINERVER} \
            -t ghcr.io/postmill-ai/postmill-app:latest \
            --build-arg NEXT_PUBLIC_VERSION=${NEXT_PUBLIC_VERSION} \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.version=${CONTAINERVER} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --push .

      - name: Verify pushed image
        run: |
          docker buildx imagetools inspect ghcr.io/postmill-ai/postmill-app:${{ github.ref_name }}

      # imagetools inspect only reads registry metadata — it never starts the image, so a
      # container that cannot boot would publish green. The image has no CMD: its
      # ENTRYPOINT is docker/entrypoint.sh, which launches the backend main.js and
      # `next start`. Assert those files actually exist in the image.
      - name: Smoke-test the image entrypoint
        run: |
          IMAGE=ghcr.io/postmill-ai/postmill-app:${{ github.ref_name }}
          docker pull "$IMAGE"
          docker run --rm --entrypoint bash "$IMAGE" -c '
            set -e
            test -f /app/docker/entrypoint.sh || { echo "FAIL: /app/docker/entrypoint.sh missing"; exit 1; }
            MAIN=$(grep -o "/app/[^ ]*\.js" /app/docker/entrypoint.sh | head -1)
            echo "Backend entry from entrypoint.sh: $MAIN"
            test -f "$MAIN" || { echo "FAIL: $MAIN does not exist in the image"; exit 1; }
            test -x /app/node_modules/.bin/next || { echo "FAIL: /app/node_modules/.bin/next missing"; exit 1; }
            echo "OK: entrypoint, backend main.js and next binary present."
          '

      # The release is the user-facing contract: notes + the exact image digest, plus the
      # image itself as a `docker save` tarball for air-gapped installs. GitHub caps a
      # release asset at 2 GB — refuse loudly rather than upload a truncated file. The
      # image is already in GHCR by this point, so a failure here leaves nothing half-done.
      - name: Export image tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          IMAGE=ghcr.io/postmill-ai/postmill-app:${TAG}
          TARBALL=postmill-app-${TAG}-linux-amd64.tar.gz
          docker save "$IMAGE" | gzip -1 > "$TARBALL"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          SIZE=$(stat -c %s "$TARBALL")
          echo "Tarball: $TARBALL ($SIZE bytes)"
          cat "${TARBALL}.sha256"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::$TARBALL is $SIZE bytes, over GitHub's 2 GB release-asset cap. The image is in GHCR; the release was not created."
            exit 1
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")" >> "$GITHUB_ENV"

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SHA256=$(cut -d' ' -f1 "${TARBALL}.sha256")
          cat > release-notes.md <<EOF
          ## Postmill ${TAG}

          Container image (linux/amd64):

          \`\`\`
          docker pull ghcr.io/postmill-ai/postmill-app:${TAG}
          \`\`\`

          Digest: \`${DIGEST}\`

          Deploy with the root [\`docker-compose.yaml\`](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docker-compose.yaml), pinning \`image:\` to this tag. Setup and upgrade guides: https://docs.postmill.ai

          ### Offline install

          \`${TARBALL}\` is the same image as a \`docker save\` archive (sha256 \`${SHA256}\`):

          \`\`\`
          sha256sum -c ${TARBALL}.sha256
          docker load < ${TARBALL}
          \`\`\`

          Changes: see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md).
          EOF
          cat release-notes.md

      # Idempotent: a re-run after a partial failure updates the existing release instead
      # of 422-ing on "already exists".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "Postmill ${TAG}" --notes-file release-notes.md
          gh release upload "$TAG" "$TARBALL" "${TARBALL}.sha256" --clobber
          gh release view "$TAG"
