# Disable the default option to open a blank issue
blank_issues_enabled: true 

# Define your custom links
contact_links:
  # The first link definition
  - name: 🙏 Installation Issue
    url: https://docs.postmill.ai
    about: If you have an installation / configuration issue, check the documentation.

  # You can add more links if needed
  - name: Security Issue
    url: https://github.com/postmill-ai/postmill-app/security/advisories/new
    about: Please submit security Issues our GitHub Security Advisories.
