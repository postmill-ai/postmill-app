info:
  title: Postmill API
  description: OpenAPI description of the Postmill backend (NestJS). Generated from the controllers — do not hand-edit; run `pnpm run openapi:generate`.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    api-key:
      type: apiKey
      in: header
      name: Authorization
    bearer:
      scheme: bearer
      bearerFormat: Token
      type: http
  schemas:
    CreateOrgUserDto:
      type: object
      properties:
        password:
          type: string
          minLength: 3
          maxLength: 64
        provider:
          type: string
          enum:
            - LOCAL
            - GITHUB
            - GOOGLE
            - FARCASTER
            - WALLET
            - GENERIC
        providerToken:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
          minLength: 3
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        lastName:
          type: string
          maxLength: 128
        datafast_visitor_id:
          type: string
      required:
        - password
        - provider
        - providerToken
        - email
        - company
        - name
        - lastName
        - datafast_visitor_id
    LoginUserDto:
      type: object
      properties:
        password:
          type: string
          minLength: 3
        provider:
          type: string
          enum:
            - LOCAL
            - GITHUB
            - GOOGLE
            - FARCASTER
            - WALLET
            - GENERIC
        providerToken:
          type: string
        email:
          type: string
          format: email
        datafast_visitor_id:
          type: string
      required:
        - password
        - provider
        - providerToken
        - email
        - datafast_visitor_id
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ForgotReturnPasswordDto:
      type: object
      properties:
        password:
          type: string
          minLength: 3
        repeatPassword:
          type: string
        token:
          type: string
          minLength: 5
      required:
        - password
        - repeatPassword
        - token
    ResendActivationDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CreateAgentDto:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        apiKey:
          type: string
      required:
        - text
        - apiKey
    ConnectIntegrationDto:
      type: object
      properties:
        state:
          type: string
        code:
          type: string
        timezone:
          type: string
        refresh:
          type: string
      required:
        - state
        - code
        - timezone
    SaveProviderPageDto:
      type: object
      properties:
        state:
          type: string
    ExtensionRefreshDto:
      type: object
      properties:
        jwt:
          type: string
        cookies:
          type: string
      required:
        - jwt
        - cookies
    TokenExchangeDto:
      type: object
      properties:
        grant_type:
          type: string
        code:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
        scope:
          type: string
      required:
        - grant_type
        - code
        - client_id
        - client_secret
    MediaDto:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        alt:
          type: string
        thumbnail:
          type: string
          format: uri
      required:
        - id
        - path
    UserDetailDto:
      type: object
      properties:
        fullname:
          type: string
          minLength: 3
        lastName:
          type: string
          maxLength: 128
        bio:
          type: string
        picture:
          $ref: "#/components/schemas/MediaDto"
        timezone:
          type: string
      required:
        - fullname
        - lastName
        - bio
        - picture
        - timezone
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    ConnectProviderDto:
      type: object
      properties:
        state:
          type: string
          maxLength: 2048
        page:
          type: string
          maxLength: 2048
        id:
          type: string
          maxLength: 2048
        pageId:
          type: string
          maxLength: 2048
        accountName:
          type: string
          maxLength: 2048
        locationName:
          type: string
          maxLength: 2048
    UpdateIntegrationGroupDto:
      type: object
      properties:
        group:
          type: string
      required:
        - group
    UpdateOnCustomerNameDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UpdateProviderSettingsDto:
      type: object
      properties:
        additionalSettings:
          type: string
      required:
        - additionalSettings
    SetNicknameDto:
      type: object
      properties:
        name:
          type: string
        picture:
          type: string
      required:
        - name
        - picture
    IntegrationValidateTimeDto:
      type: object
      properties:
        time:
