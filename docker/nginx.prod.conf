# All-in-one production image: nginx fronts the container on :5000.
#   /api/*     → NestJS backend on 127.0.0.1:3000 (the /api prefix is stripped —
#                the backend serves routes at root, e.g. api.postmill.ai/auth/login)
#   /uploads/* → served straight from the uploads volume when the file exists
#                (the backend has no uploads route — uploaded-media URLs are
#                FRONTEND_URL + /uploads/..., see libraries/providers/local);
#                a missing file falls through to the frontend's /uploads route
#                (S3 mode: 307 to S3_PUBLIC_URL)
#   everything else → Next.js frontend prod server on 127.0.0.1:4200
#
# Runs as the unprivileged `app` user: no `user` directive, and every path nginx
# would otherwise open as root (pid, logs, temp dirs) lives under /tmp.
daemon                      off;
pid                         /tmp/nginx/nginx.pid;
error_log                   /dev/stderr warn;
worker_processes            auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /dev/stdout;
    client_max_body_size 2G;

    # WebSocket upgrade support (Socket.IO connects through /api/socket.io/;
    # without these headers the proxy strips Upgrade and clients silently fall
    # back to long-polling).
    map $http_upgrade $connection_upgrade {
        default                 upgrade;
        ''                      close;
    }

    client_body_temp_path       /tmp/nginx/client_body;
    proxy_temp_path             /tmp/nginx/proxy;
    fastcgi_temp_path           /tmp/nginx/fastcgi;
    uwsgi_temp_path             /tmp/nginx/uwsgi;
    scgi_temp_path              /tmp/nginx/scgi;

    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location /api/ {
            # Trailing slash on proxy_pass: the matched /api/ prefix is replaced
            # by /, so /api/auth/login → http://127.0.0.1:3000/auth/login.
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /uploads/ {
            # Serve files present on the uploads volume directly. `root /` maps
            # /uploads/<path> to the same on-disk file the old `alias /uploads/`
            # did, without alias+try_files quirks. A missing file falls through
            # to the frontend's /uploads route, which serves local files or, in
            # STORAGE_PROVIDER=s3 mode, 307-redirects legacy URLs to S3_PUBLIC_URL.
            root /;
            try_files $uri @uploads_app;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        # Missing-on-disk /uploads/* → frontend, request path preserved (a named
        # location's proxy_pass takes no URI, so $uri is passed through as-is).
        # The uploads-location headers above do not apply here; the Next route
        # sets its own.
        location @uploads_app {
            proxy_pass http://127.0.0.1:4200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:4200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}
